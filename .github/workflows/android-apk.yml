name: Build Jawlah Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'assets/branding/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    name: Flutter Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out app source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android native project
        run: flutter create --platforms android --project-name jawlah_real_estate --org sa.jawlah .
      - name: Set Arabic launcher app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          source = p.read_text()
          source = source.replace('android:label="jawlah_real_estate"', 'android:label="جولة العقارية"')
          if '<uses-permission android:name="android.permission.INTERNET"' not in source:
              source = source.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          p.write_text(source)
          PY
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Generate official Jawlah app icon
        run: dart run flutter_launcher_icons
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos lib
      - name: Build installable Android debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build apk --debug --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: jawlah-v0.3.0-phone-otp-logo-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
