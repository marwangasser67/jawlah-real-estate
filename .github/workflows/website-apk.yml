name: Build Jawlah Website APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/website_main.dart'
      - 'pubspec.yaml'
      - '.github/workflows/website-apk.yml'

permissions:
  contents: read

jobs:
  website-apk:
    name: Build installable Jawlah website APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms android --project-name jawlah_real_estate --org sa.jawlah .
      - name: Name and identify the website app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          src = manifest.read_text()
          src = src.replace('android:label="jawlah_real_estate"', 'android:label="جولة العقارية"')
          if '<uses-permission android:name="android.permission.INTERNET"' not in src:
              src = src.replace('<application',
                  '<uses-permission android:name="android.permission.INTERNET" />\\n    <application', 1)
          manifest.write_text(src)

          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              text = gradle.read_text()
              text, count = re.subn(r'applicationId\\s*=\\s*"[^"]+"',
                  'applicationId = "sa.jawlah.website"', text)
          else:
              gradle = Path('android/app/build.gradle')
              text = gradle.read_text()
              text, count = re.subn(r'applicationId\\s+["\\'][^"\\']+["\\']',
                  'applicationId "sa.jawlah.website"', text)
          assert count == 1, 'Could not set the website app package id'
          gradle.write_text(text)
          PY
      - name: Fetch Flutter packages
        run: flutter pub get
      - name: Generate Jawlah launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze website app
        run: flutter analyze --no-fatal-infos lib/website_main.dart
      - name: Build installable Android APK
        run: flutter build apk --debug --target lib/website_main.dart
      - name: Stage APK
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-debug.apk releases/Jawlah-Website.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jawlah-Website-APK
          path: releases/Jawlah-Website.apk
          retention-days: 30
