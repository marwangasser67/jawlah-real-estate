name: jawlah_real_estate
description: Jawlah Real Estate luxury Arabic mobile showcase.
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  crypto: ^3.0.6
  app_links: ^6.4.1
  image_picker: ^1.1.2
  http_parser: ^4.1.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/jawlah_launcher.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/jawlah_launcher.png
  adaptive_icon_background: '#0E0F11'
  adaptive_icon_foreground: assets/branding/jawlah_launcher.png
